name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The @toolbox/widgets dependency is a sibling checkout.
      - name: Fetch widget core
        shell: bash
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/28121978444/toolbox-widgets.git" ../toolbox-widgets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm test
